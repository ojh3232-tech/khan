
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자책</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .header {
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background-color: #2563eb;
      color: #ffffff;
    }

    .header h3 {
      margin: 0;
      font-size: 16px;
    }

    .header button {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      background-color: #ffffff;
      color: #2563eb;
      cursor: pointer;
      font-size: 14px;
    }

    .header button:hover {
      background-color: #e5e7eb;
    }

    #ebookFrame {
      display: block;
      width: 100%;
      height: calc(100% - 50px);
      border: none;
    }
  </style>
</head>

<body>
  <header class="header">
    <h3>전자책</h3>
    <button type="button" id="reloadBtn">새로고침</button>
  </header>

  <iframe
  id="ebookFrame"
  src="https://ebook.gointro.com/books/faen/"
  title="전자책 뷰어"
  style="width:100%; height:calc(100vh - 50px); border:0;"
  allowfullscreen>
</iframe>

  <script>
    document.getElementById("reloadBtn").addEventListener("click", function () {
      const frame = document.getElementById("ebookFrame");
      frame.src = frame.src;
    });
  </script>
</body>
</html>

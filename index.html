<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>80년사</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity .3s;
    }
    #viewer.loaded { opacity: 1; }
    #loading, #blocked, #mobile {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ccc;
      font-size: 14px;
    }
    #blocked, #mobile { display: none; }
    #mobile { text-align: center; line-height: 1.6; padding: 0 20px; }
    #mobile .msg-title { font-size: 17px; color: #eee; font-weight: 600; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #444;
      border-top-color: #ccc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>로딩 중입니다...</div>
  </div>

  <div id="mobile">
    <div class="msg-title">PC에서 접속해 주세요.</div>
    <div>모바일·태블릿 환경에서는 지원되지 않습니다.</div>
  </div>

  <div id="blocked">
    <div>잘못된 접근입니다.</div>
  </div>

  <iframe id="viewer"
          src="about:blank"
          title="80년사"
          allow="fullscreen"
          allowfullscreen></iframe>

  <script>
    (function () {
      // 이 도메인의 링크를 타고 들어온 경우만 허용
      var ALLOWED = ['gwk.khan.co.kr'];
      var FLAG = 'khan80_ok';

      var viewer = document.getElementById('viewer');
      var loading = document.getElementById('loading');
      var blocked = document.getElementById('blocked');
      var mobile = document.getElementById('mobile');

      // 모바일·태블릿 판별 (iPad 데스크톱 모드 포함)
      function isMobile() {
        var ua = navigator.userAgent || '';
        if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
        if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) return true;
        if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;
        return false;
      }

      // 모바일이면 안내 문구만 보여주고 중단
      if (isMobile()) {
        loading.style.display = 'none';
        mobile.style.display = 'flex';
        viewer.remove();
        return;
      }

      // 이번 진입이 새로고침인지 확인
      function isReload() {
        try {
          var nav = performance.getEntriesByType('navigation')[0];
          if (nav) return nav.type === 'reload';
          return performance.navigation && performance.navigation.type === 1;
        } catch (e) {
          return false;
        }
      }

      function fromAllowedSite() {
        if (!document.referrer) return false;   // 주소 직접 입력, 붙여넣기, 즐겨찾기
        var host;
        try { host = new URL(document.referrer).hostname; }
        catch (e) { return false; }

        for (var i = 0; i < ALLOWED.length; i++) {
          var d = ALLOWED[i];
          if (host === d || host.slice(-(d.length + 1)) === '.' + d) return true;
        }
        return false;
      }

      function isAllowed() {
        // 1) 허용된 사이트의 링크로 들어온 경우
        if (fromAllowedSite()) {
          try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
          return true;
        }

        // 2) 정상 진입했던 탭에서 "새로고침"한 경우만 허용
        try {
          if (isReload() && sessionStorage.getItem(FLAG) === '1') return true;
          sessionStorage.removeItem(FLAG);   // 그 외에는 통과 표시 삭제
        } catch (e) {}

        return false;
      }

      if (!isAllowed()) {
        loading.style.display = 'none';
        blocked.style.display = 'flex';
        viewer.remove();
        return;
      }

      var _k = '==wLuVWYm9yZmpWen9SbvNmL1wWb0hGcpxmZuUmbpxmbv9yL6MHc0RHa';

      viewer.addEventListener('load', function () {
        if (!viewer.dataset.started) return;
        viewer.classList.add('loaded');
        loading.style.display = 'none';
      });

      viewer.dataset.started = '1';
      viewer.contentWindow.location.replace(
        atob(_k.split('').reverse().join(''))
      );

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    })();
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전자책 iframe 테스트</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: #2563eb;
      color: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 50px);
      border: 3px solid red;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>전자책 iframe 테스트</strong>
    <button onclick="document.getElementById('book').src =
      document.getElementById('book').src">새로고침</button>
  </div>

  <iframe
    id="book"
    src="https://ebook.gointro.com/books/faen/"
    title="전자책">
  </iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>80년사</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity .3s;
    }
    #viewer.loaded { opacity: 1; }
    #loading, #blocked {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ccc;
      font-size: 14px;
    }
    #blocked { display: none; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #444;
      border-top-color: #ccc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>로딩 중입니다...</div>
  </div>

  <div id="blocked">
    <div>잘못된 접근입니다.</div>
  </div>

  <iframe id="viewer"
          src="about:blank"
          title="80년사"
          allow="fullscreen"
          allowfullscreen></iframe>

  <script>
    (function () {
      // 이 도메인의 링크를 타고 들어온 경우만 허용
      var ALLOWED = ['gwk.khan.co.kr'];

      var viewer = document.getElementById('viewer');
      var loading = document.getElementById('loading');
      var blocked = document.getElementById('blocked');

      function isAllowed() {
        // 이미 정상 진입한 탭이면 새로고침해도 허용
        try {
          if (sessionStorage.getItem('khan80_ok') === '1') return true;
        } catch (e) {}

        if (!document.referrer) return false;   // 주소 직접 입력, 즐겨찾기 등

        var host;
        try { host = new URL(document.referrer).hostname; }
        catch (e) { return false; }

        for (var i = 0; i < ALLOWED.length; i++) {
          var d = ALLOWED[i];
          if (host === d || host.slice(-(d.length + 1)) === '.' + d) {
            try { sessionStorage.setItem('khan80_ok', '1'); } catch (e) {}
            return true;
          }
        }
        return false;
      }

      if (!isAllowed()) {
        loading.style.display = 'none';
        blocked.style.display = 'flex';
        viewer.remove();
        return;
      }

      var _k = '==wLuVWYm9yZmpWen9SbvNmL1wWb0hGcpxmZuUmbpxmbv9yL6MHc0RHa';

      viewer.addEventListener('load', function () {
        if (!viewer.dataset.started) return;
        viewer.classList.add('loaded');
        loading.style.display = 'none';
      });

      viewer.dataset.started = '1';
      viewer.contentWindow.location.replace(
        atob(_k.split('').reverse().join(''))
      );

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    })();
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전자책</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #2563eb;
      color: white;
    }

    .header h3 {
      margin: 0;
      font-size: 16px;
    }

    .header button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 50px);
      border: none;
    }
  </style>
</head>

<body>
  <div class="header">
    <h3>전자책</h3>
    <button onclick="reloadBook()">새로고침</button>
  </div>

  <iframe
    id="ebookFrame"
    src="http://ebook.gointro.com/books/faen/"
    title="전자책 뷰어"
    allowfullscreen>
  </iframe>

  <script>
    function reloadBook() {
      const frame = document.getElementById("ebookFrame");
      frame.src = frame.src;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>80년사</title>
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity .3s;
    }
    #viewer.loaded { opacity: 1; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ccc;
      font-size: 14px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #444;
      border-top-color: #ccc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>로딩 중입니다...</div>
  </div>

  <iframe id="viewer"
          src="about:blank"
          title="80년사"
          allow="fullscreen"
          allowfullscreen></iframe>

  <script>
    (function () {
      var _k = '==wLuVWYm9yZmpWen9SbvNmL1wWb0hGcpxmZuUmbpxmbv9yL6MHc0RHa';

      var viewer = document.getElementById('viewer');
      var loading = document.getElementById('loading');

      viewer.addEventListener('load', function () {
        // 처음 about:blank 로드는 무시하고, 전자책 로드 완료 시에만 표시
        if (!viewer.dataset.started) return;
        viewer.classList.add('loaded');
        loading.style.display = 'none';
      });

      // src 속성은 about:blank 그대로 두고, 프레임 내부만 이동
      viewer.dataset.started = '1';
      viewer.contentWindow.location.replace(
        atob(_k.split('').reverse().join(''))
      );

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    })();
  </script>
</body>
</html>
